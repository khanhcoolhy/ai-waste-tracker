<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Waste Tracker 🌍</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

    <style>
        /* Reset CSS cơ bản */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Nunito', sans-serif;
            /* Phối nền Gradient xanh lá cây - trắng siêu dịu mắt */
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            color: #2e7d32;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Phần Tiêu đề */
        .header {
            text-align: center;
            margin-bottom: 15px;
            margin-top: 10px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: #1b5e20;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 5px;
        }

        .header p {
            font-size: 1.1rem;
            color: #388e3c;
            font-weight: 700;
        }

        /* Thanh trạng thái Status (Được JS tự động đổi màu) */
        #status-container { margin-bottom: 20px; }
        #status {
            display: inline-block;
            padding: 8px 25px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            background-color: #ffb300; 
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }

        /* Khung Camera chuẩn xịn */
        .camera-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px; /* Kích thước tối ưu nhất cho web và điện thoại */
            aspect-ratio: 1 / 1; /* Giữ khung luôn vuông */
            background-color: #000;
            border-radius: 24px; /* Bo góc cực mạnh */
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(46, 125, 50, 0.4);
            border: 6px solid #ffffff;
        }

        /* Tự động thu phóng Video và Canvas vừa khít với wrapper */
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        /* Khung thông điệp dưới cùng */
        .eco-message {
            margin-top: 30px;
            text-align: center;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.85);
            padding: 15px 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            backdrop-filter: blur(5px);
        }
        
        .eco-message p.main-text { 
            font-size: 1.1rem; 
            color: #2e7d32; 
            font-weight: 900; 
        }
        
        .eco-message p.sub-text { 
            font-size: 0.9rem; 
            color: #66bb6a; 
            font-weight: 700; 
            margin-top: 5px; 
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🌍 AI Waste Tracker</h1>
        <p>Hệ Thống Phân Loại Rác Thông Minh</p>
    </div>

    <div id="status-container">
        <div id="status">⏳ Đang nạp Model...</div>
    </div>
    
    <div class="camera-wrapper">
        <video id="video" width="640" height="640" autoplay playsinline></video>
        <canvas id="canvas" width="640" height="640"></canvas>
    </div>

    <div class="eco-message">
        <p class="main-text">♻️ Đưa rác vào camera để nhận diện nhé!</p>
        <p class="sub-text">Hỗ trợ: Hữu cơ • Tái chế • Độc hại • Khác</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
