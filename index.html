<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Waste Tracker 🌍</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            color: #2e7d32;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px; 
        }
        
        .header { text-align: center; margin-bottom: 20px; margin-top: 10px; }
        .header h1 { font-size: 2.2rem; font-weight: 900; color: #1b5e20; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); margin-bottom: 5px; }
        .header p { font-size: 1rem; color: #388e3c; font-weight: 700; }
        
        #status-container { margin-bottom: 25px; width: 100%; text-align: center; }
        #status {
            display: inline-block; padding: 12px 30px; border-radius: 50px;
            font-weight: bold; font-size: 1rem; background-color: #ffb300; color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: all 0.3s ease;
        }

        /* --- KHUNG CAMERA CHÀ BÁ --- */
        .camera-wrapper {
            position: relative; 
            width: 100%; 
            max-width: 700px; 
            aspect-ratio: 1 / 1; 
            background-color: #000; border-radius: 24px; overflow: hidden;
            box-shadow: 0 15px 35px rgba(46, 125, 50, 0.4); border: 4px solid #ffffff;
        }
        
        video, canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; 
        }

        @media (max-width: 400px) {
            .header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🌍 AI Waste Tracker</h1>
        <p>Phiên Bản Live Cam Siêu Nhẹ</p>
    </div>

    <div id="status-container">
        <div id="status">⏳ Đang nạp hệ thống...</div>
    </div>
    
    <div class="camera-wrapper">
        <video id="video" width="640" height="640" autoplay playsinline muted></video>
        <canvas id="canvas" width="640" height="640"></canvas>
    </div>

    <script src="app.js"></script>
</body>
</html>
