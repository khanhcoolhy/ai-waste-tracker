<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Waste Tracker 🌍</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            color: #2e7d32;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .header { text-align: center; margin-bottom: 15px; margin-top: 10px; }
        .header h1 { font-size: 2.2rem; font-weight: 900; color: #1b5e20; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); margin-bottom: 5px; }
        .header p { font-size: 1.1rem; color: #388e3c; font-weight: 700; }
        
        #status-container { margin-bottom: 15px; }
        #status {
            display: inline-block; padding: 8px 25px; border-radius: 50px;
            font-weight: bold; background-color: #ffb300; color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: all 0.3s ease;
        }

        /* Bảng điều khiển mới */
        .controls {
            display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
            max-width: 500px; margin-bottom: 20px; width: 100%;
        }
        .btn {
            padding: 10px 18px; border: none; border-radius: 12px;
            font-weight: bold; font-size: 1rem; cursor: pointer; color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-cam { background: #2196F3; }
        .btn-upload { background: #9C27B0; }
        .btn-url { background: #FF9800; }
        .input-url {
            flex: 1; min-width: 200px; padding: 10px; border-radius: 12px;
            border: 2px solid #fff; outline: none; font-family: inherit;
        }

        .camera-wrapper {
            position: relative; width: 100%; max-width: 500px; aspect-ratio: 1 / 1;
            background-color: #000; border-radius: 24px; overflow: hidden;
            box-shadow: 0 15px 35px rgba(46, 125, 50, 0.4); border: 6px solid #ffffff;
        }
        /* Dùng fill để đảm bảo BBox không bị lệch tọa độ khi ảnh không vuông */
        video, canvas, img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; 
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🌍 AI Waste Tracker</h1>
        <p>Hệ Thống Phân Loại Rác Thông Minh</p>
    </div>

    <div id="status-container">
        <div id="status">⏳ Đang nạp Model...</div>
    </div>

    <div class="controls">
        <button class="btn btn-cam" id="btn-cam">📷 Dùng Camera</button>
        <input type="file" id="upload-file" accept="image/*" style="display: none;">
        <button class="btn btn-upload" onclick="document.getElementById('upload-file').click()">📂 Tải ảnh lên</button>
        
        <div style="display: flex; gap: 8px; width: 100%; margin-top: 5px;">
            <input type="text" id="input-url" class="input-url" placeholder="Dán link ảnh vào đây...">
            <button class="btn btn-url" id="btn-url">🌐 Quét Link</button>
        </div>
    </div>
    
    <div class="camera-wrapper">
        <video id="video" width="640" height="640" autoplay playsinline></video>
        <img id="static-img" crossorigin="anonymous" style="display: none;">
        <canvas id="canvas" width="640" height="640"></canvas>
    </div>

    <script src="app.js"></script>
</body>
</html>
