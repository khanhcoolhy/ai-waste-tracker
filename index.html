<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Waste Tracker 🌍</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            color: #2e7d32;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px; /* Giảm padding cho mobile */
        }
        
        .header { text-align: center; margin-bottom: 15px; margin-top: 5px; }
        .header h1 { font-size: 2rem; font-weight: 900; color: #1b5e20; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); margin-bottom: 5px; }
        .header p { font-size: 1rem; color: #388e3c; font-weight: 700; }
        
        #status-container { margin-bottom: 15px; width: 100%; text-align: center; }
        #status {
            display: inline-block; padding: 10px 25px; border-radius: 50px;
            font-weight: bold; font-size: 0.95rem; background-color: #ffb300; color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: all 0.3s ease;
        }

        /* --- BẢNG ĐIỀU KHIỂN --- */
        .controls-wrapper {
            background: rgba(255, 255, 255, 0.85);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            backdrop-filter: blur(5px);
            width: 100%;
            max-width: 700px; /* 👉 Đã mở rộng không gian lên 700px */
            margin-bottom: 20px;
        }

        .tabs {
            display: flex; gap: 5px; background: #e0e0e0;
            padding: 5px; border-radius: 15px; margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1; padding: 12px 5px; /* Tăng chiều cao để dễ bấm trên đt */
            border: none; background: transparent;
            color: #555; font-weight: bold; font-size: 0.95rem;
            border-radius: 10px; cursor: pointer; transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #4CAF50; color: white;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.4);
        }

        .tab-content { display: none; text-align: center; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .btn {
            padding: 12px 20px; border: none; border-radius: 12px; /* Nút bấm to hơn */
            font-weight: bold; font-size: 1rem; cursor: pointer; color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s;
            width: 100%;
        }
        .btn:active { transform: translateY(2px); } /* Hiệu ứng bấm thực tế hơn hover trên đt */
        .btn-upload { background: #9C27B0; }
        .btn-url { background: #FF9800; white-space: nowrap; width: auto; }
        
        .input-group { display: flex; gap: 8px; width: 100%; flex-wrap: wrap; }
        .input-url {
            flex: 1; padding: 12px; border-radius: 12px; min-width: 200px;
            border: 2px solid #ccc; outline: none; font-family: inherit;
            font-size: 16px; /* Bắt buộc 16px để iOS không tự zoom màn hình */
        }
        .input-url:focus { border-color: #4CAF50; }

        /* --- KHUNG CAMERA CHÀ BÁ --- */
        .camera-wrapper {
            position: relative; 
            width: 100%; 
            max-width: 700px; /* 👉 To tối đa 700px, nhưng vẫn auto bóp lại nếu màn đt bé */
            aspect-ratio: 1 / 1; 
            background-color: #000; border-radius: 24px; overflow: hidden;
            box-shadow: 0 15px 35px rgba(46, 125, 50, 0.4); border: 4px solid #ffffff;
        }
        
        video, canvas, img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; 
        }

        /* Tinh chỉnh cho màn hình siêu nhỏ */
        @media (max-width: 400px) {
            .header h1 { font-size: 1.6rem; }
            .btn-url { width: 100%; } /* Đẩy nút Quét Link xuống hàng dưới cho dễ bấm */
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🌍 AI Waste Tracker</h1>
        <p>Hệ Thống Phân Loại Rác Thông Minh</p>
    </div>

    <div id="status-container">
        <div id="status">⏳ Đang nạp Model...</div>
    </div>

    <div class="controls-wrapper">
        <div class="tabs">
            <button class="tab-btn active" data-tab="cam">📷 Live Cam</button>
            <button class="tab-btn" data-tab="upload">📂 Tải Ảnh</button>
            <button class="tab-btn" data-tab="url">🌐 Link Ảnh</button>
        </div>

        <div class="tab-content active" id="tab-cam">
            <p style="color: #388e3c; font-weight: bold; font-size: 0.95rem;" id="cam-instruction">Đang kích hoạt Camera...</p>
        </div>

        <div class="tab-content" id="tab-upload">
            <input type="file" id="upload-file" accept="image/*" style="display: none;">
            <button class="btn btn-upload" onclick="document.getElementById('upload-file').click()">
                Bấm vào đây để chọn ảnh
            </button>
        </div>

        <div class="tab-content" id="tab-url">
            <div class="input-group">
                <input type="text" id="input-url" class="input-url" placeholder="Dán link ảnh vào đây...">
                <button class="btn btn-url" id="btn-url">Quét Ngay</button>
            </div>
        </div>
    </div>
    
    <div class="camera-wrapper">
        <video id="video" width="640" height="640" autoplay playsinline muted></video>
        <img id="static-img" crossorigin="anonymous" style="display: none;">
        <canvas id="canvas" width="640" height="640"></canvas>
    </div>

    <script src="app.js"></script>
</body>
</html>
